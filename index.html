<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    
    <!-- Favicons -->
    <link rel="icon" type="image/png" href="/images/logo.png" />
    <link rel="apple-touch-icon" href="/images/logo.png" />
    
    <!-- Mobile Browser Theme Color -->
    <meta name="theme-color" content="#ffffff" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    
    <!-- SEO: Title, Description, and Keywords -->
    <title>Mount Moriah International Christian School | Nairobi</title>
    <meta 
      name="description" 
      content="Welcome to Mount Moriah International Christian School (also known as Mount Moriah School). We provide quality Christian education through the CBC curriculum in Nairobi." 
    />
    <meta 
      name="keywords" 
      content="Mount Moriah School, Mount Moriah International, Moriah International, Moriah School, Mount Moriah International Christian School, Moriah International Christian School, Christian School Kenya, CBC School Nairobi" 
    />
    
    <!-- Structured Data to force Logo in Search Results and link Alternate Names -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "School",
      "name": "Mount Moriah International Christian School",
      "alternateName": [
        "Mount Moriah School", 
        "Moriah International", 
        "Moriah School"
      ],
      "url": "https://www.mountmoriahinternationalchristianschool.com",
      "logo": "https://www.mountmoriahinternationalchristianschool.com/images/logo.png",
      "sameAs": [
        "https://www.facebook.com/profile.php?id=61552753215844"
      ]
    }
    </script>
    
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
